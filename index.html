<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style>
</head>
<body>
<title>노트르담 산책</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D interior; quiet HUD pinned to the corners; one entry card over the scene. Single dark look by choice (HUD over a lit stone interior). */
:root {
  --night: #15110d;
  --vellum: #f1e8d6;
  --gilt: #d6a24a;
  --lapis: #4a6cc4;
  --ash: #b3a894;
  --panel: rgba(21, 17, 13, 0.80);
  --panel-soft: rgba(21, 17, 13, 0.58);
  --line: rgba(241, 232, 214, 0.18);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--vellum); font-family: var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
#scene:active { cursor: grabbing; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gilt); outline-offset: 2px; }

/* entry */
#entry { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: radial-gradient(ellipse at 50% 40%, rgba(21, 17, 13, 0.1), rgba(21, 17, 13, 0.7)); }
.card { width: 100%; max-width: 430px; display: grid; gap: 18px; padding: 28px 26px 24px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; color: var(--gilt); }
.card h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.15; text-wrap: balance; letter-spacing: 0.02em; }
.card p { margin: 0; line-height: 1.65; color: var(--ash); font-size: 14px; }
.card p.lead { color: var(--vellum); }
.field { display: grid; gap: 8px; }
.field label, .field .lab { font-size: 13px; color: var(--vellum); }
#nick { width: 100%; box-sizing: border-box; padding: 11px 12px; background: rgba(241, 232, 214, 0.06); border: 1px solid var(--line); border-radius: 4px; }
#nick::placeholder { color: var(--ash); }
.robes { display: flex; flex-wrap: wrap; gap: 8px; }
.robe { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px 6px 7px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-size: 13px; color: var(--ash); }
.robe i { width: 14px; height: 14px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.robe[aria-pressed="true"] { border-color: var(--gilt); color: var(--vellum); background: rgba(214, 162, 74, 0.12); }
#enterBtn { padding: 13px 16px; border: 0; border-radius: 4px; background: var(--gilt); color: #1b130a; font-weight: 600; font-size: 15px; cursor: pointer; }
#enterBtn:hover { filter: brightness(1.07); }
.fine { font-size: 12.5px; color: var(--ash); line-height: 1.6; }
#entryCount { color: var(--vellum); }

/* HUD */
.hud { position: fixed; z-index: 10; }
#badge { top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 12px);
  display: grid; gap: 2px; padding: 8px 12px; background: var(--panel-soft); border: 1px solid var(--line); border-radius: 4px; font-size: 13px; max-width: calc(100vw - 120px); }
#badge .row { display: flex; align-items: center; gap: 8px; }
#dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ash); flex: none; }
#dot.on { background: var(--gilt); box-shadow: 0 0 8px var(--gilt); }
#net { color: var(--ash); font-size: 12px; }
#zone { font-family: var(--f-display); color: var(--ash); font-size: 12.5px; }
#hint { top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px); max-width: 400px; text-align: right;
  font-size: 12px; color: var(--vellum); line-height: 1.5; transition: opacity 1.2s; text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.6); }
#hint.fade { opacity: 0; }
#log { left: calc(env(safe-area-inset-left, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); width: min(380px, calc(100vw - 24px));
  display: grid; gap: 4px; pointer-events: none; font-size: 13px; line-height: 1.45; }
#log div { text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.7); overflow-wrap: anywhere; transition: opacity 1.5s; }
#log div.old { opacity: 0.0; }
#log b { color: var(--gilt); font-weight: 600; margin-right: 6px; }
#log .sys { color: var(--vellum); opacity: 0.85; }
#bar { left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 12px); pointer-events: none; }
#bar > * { pointer-events: auto; }
#chatForm { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; max-width: 520px; }
#chatInput { flex: 1 1 auto; min-width: 0; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
#chatInput::placeholder { color: var(--ash); }
#chatInput:disabled { opacity: 0.75; }
.btn { padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: default; }
#waveBtn { border-color: rgba(214, 162, 74, 0.5); }
#stick { position: fixed; z-index: 9; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 1px solid var(--line); background: rgba(241,232,214,.08); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(214,162,74,.45); border: 1px solid rgba(214,162,74,.8); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 560px) { #hint { max-width: 170px; } #sendBtn { display: none; } }
@media (prefers-reduced-motion: reduce) { #hint, #log div { transition: none; } }
</style>

<canvas id="scene" tabindex="0" aria-label="노트르담 대성당 실내를 본뜬 3D 화면"></canvas>

<div id="badge" class="hud" hidden>
  <div class="row"><span id="dot"></span><span id="count">혼자 둘러보는 중입니다</span></div>
  <div id="net"></div>
  <div id="zone">신랑</div>
</div>
<div id="hint" class="hud" hidden></div>
<div id="log" class="hud" aria-live="polite" hidden></div>
<div id="bar" class="hud" hidden>
  <form id="chatForm" autocomplete="off">
    <label class="sr" for="chatInput">대화</label>
    <input id="chatInput" maxlength="120" placeholder="연결되면 대화할 수 있습니다" disabled>
    <button id="sendBtn" class="btn" type="submit" disabled>보내기</button>
  </form>
  <button id="waveBtn" class="btn" type="button">손 흔들기</button>
</div>
<div id="stick" hidden><div id="knob"></div></div>

<div id="entry">
  <form class="card" id="entryForm" autocomplete="off">
    <div class="eyebrow">함께 걷는 가상 성당</div>
    <h1>노트르담 산책</h1>
    <p class="lead">파리 노트르담 대성당 실내를 본떠 만든 가상 공간입니다.</p>
    <p>이 링크를 연 사람들이 같은 신랑을 함께 걷습니다. 서로의 모습이 보이고, 짧은 인사를 나눌 수 있습니다.</p>
    <div class="field">
      <label for="nick">부를 이름 (선택)</label>
      <input id="nick" maxlength="20" placeholder="비워 두면 계정 이름이나 '순례자'로 보입니다">
    </div>
    <div class="field">
      <span class="lab" id="robeLab">옷 색</span>
      <div class="robes" id="robes" role="group" aria-labelledby="robeLab"></div>
    </div>
    <button id="enterBtn" type="submit">입장하기</button>
    <div class="fine"><span id="entryCount">연결을 확인하고 있습니다…</span><br><span id="entryHelp">WASD로 걷고(Shift는 빠르게) 마우스를 끌어 시점을 돌립니다. 휠로 카메라 거리를 조절합니다.</span></div>
  </form>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- small helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wrapA = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const r2 = (v) => Math.round(v * 100) / 100;
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};
const INVIS = /[\u0000-\u001f\u007f-\u009f\u00ad\u061c\u180e\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff\ue000-\uf8ff]/g;
function cleanText(s, max) { return typeof s === 'string' ? s.replace(INVIS, '').trim().slice(0, max) : ''; }
function num(v, a, b) { return (typeof v === 'number' && Number.isFinite(v)) ? clamp(v, a, b) : null; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const coarse = window.matchMedia('(pointer: coarse)').matches;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// pointed (gothic) arch: half-width a, rise above springing
function archR(a, rise) { return (a * a + rise * rise) / (2 * a); }
function profH(a, rise, x) { x = Math.abs(x); if (x >= a) return 0; const r = archR(a, rise), cx = a - r, d = x - cx; return Math.sqrt(Math.max(0, r * r - d * d)); }
function profPts(a, rise, n) {
  const r = archR(a, rise), cx = a - r, ta = Math.acos(clamp(-cx / r, -1, 1)), R = [];
  for (let k = 0; k <= n; k++) { const t = ta * k / n; R.push([cx + r * Math.cos(t), r * Math.sin(t)]); }
  const out = [];
  for (let k = 0; k <= n; k++) out.push([-R[k][0], R[k][1]]);
  for (let k = n - 1; k >= 0; k--) out.push([R[k][0], R[k][1]]);
  return out;
}

// ---------- robe colours ----------
const ROBES = [
  { name: '백색', hex: '#e9e2d0' }, { name: '홍색', hex: '#a3262a' }, { name: '녹색', hex: '#2f6e45' },
  { name: '자색', hex: '#5a2f80' }, { name: '청색', hex: '#2c4f9e' }, { name: '금색', hex: '#c4952f' },
];
const HEX = /^#[0-9a-f]{6}$/i;
const ROBE_HEX = new Set(ROBES.map((r) => r.hex));   // only palette colours are accepted from the network

// ---------- renderer / scene ----------
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !coarse, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse ? 1.4 : 1.6));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#3a3128');
scene.fog = new THREE.FogExp2('#d8cbb2', 0.0042);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 280);
camera.rotation.order = 'YXZ';

// ---------- plan, in metres (x: north − / south +, z: east − / west +; 1 unit = 1 m) ----------
const A = 6.5;                    // nave & choir pier line (13 m central vessel)
const X1 = 12.4, X2 = 18.3;       // pier lines between the double aisles (5.9 m each)
const XC = 23.3, RC = 22.3;       // side-chapel outer wall, radiating-chapel outer radius
const ZW = 67, ZT = 7, ZA = -38.5, XT = 24;  // west wall, transept half-width (14 m), apse centre, transept end (48 m)
const SP = 23.5, CR = 33, LUN = 30;          // high vault springing, crown (33 m), formeret apex
const ARC_SP = 7.2;                          // great arcade springing
const ISP = 6.6, ICR = 10.5, OSP = 6.4, OCR = 10.1, CSP = 6.0, CCR = 9.4; // inner aisle, outer aisle, chapels
const NAVE_Z = []; for (let k = 0; k <= 10; k++) NAVE_Z.push(ZT + 6 * k);       // 10 bays, 7..67
const CHOIR_Z = [-7, -14.875, -22.75, -30.625, ZA];                             // 4 choir bays
const PHI_APSE = []; for (let k = 0; k <= 5; k++) PHI_APSE.push(Math.PI * k / 5);   // 5-sided hemicycle
const polar = (r, phi) => [r * Math.cos(phi), ZA - r * Math.sin(phi)];

// ---------- procedural textures ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function speckle(g, w, h, n, rnd, alpha) {
  for (let i = 0; i < n; i++) { const v = rnd() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${v},${v},${v},${alpha * rnd()})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
}
// blonde limestone, ashlar courses
const stoneTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = rng(7); g.fillStyle = '#d9c9a8'; g.fillRect(0, 0, w, h);
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * 80;
    for (let x = -off; x < w; x += 160) { g.fillStyle = `hsl(${38 + rnd() * 6}, ${30 + rnd() * 10}%, ${76 + rnd() * 8}%)`; g.fillRect(x + 1.5, r * rh + 1.5, 157, rh - 3); }
  }
  speckle(g, w, h, 7000, rnd, 0.07);
  g.fillStyle = 'rgba(140,118,84,0.45)';
  for (let r = 0; r <= rows; r++) g.fillRect(0, r * rh - 1, w, 2);
  for (let r = 0; r < rows; r++) { const off = (r % 2) * 80; for (let x = -off; x < w; x += 160) g.fillRect(x - 1, r * rh, 2, rh); }
}, true);
const vaultTex = canvasTex(256, 256, (g, w, h) => {
  const rnd = rng(11); g.fillStyle = '#e2d4b6'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 6; r++) for (let x = 0; x < w; x += 64) { g.fillStyle = `hsl(40, ${28 + rnd() * 8}%, ${80 + rnd() * 6}%)`; g.fillRect(x + (r % 2) * 32, r * 43, 63, 42); }
  speckle(g, w, h, 3000, rnd, 0.06);
  g.fillStyle = 'rgba(150,128,96,0.28)'; for (let r = 0; r <= 6; r++) g.fillRect(0, r * 43 - 1, w, 1.5);
}, true);
// 19th-century diagonal chequer of white limestone and black marble
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const rnd = rng(3), a = 128 / Math.SQRT2;
  g.save(); g.rotate(Math.PI / 4);
  for (let i = -8; i <= 8; i++) for (let j = -8; j <= 8; j++) {
    const dark = ((i + j) % 2 + 2) % 2 === 1;
    g.fillStyle = dark ? `hsl(20, 8%, ${15 + rnd() * 5}%)` : `hsl(42, 24%, ${82 + rnd() * 6}%)`;
    g.fillRect(i * a, j * a, a, a);
    g.strokeStyle = dark ? 'rgba(255,255,255,0.07)' : 'rgba(120,100,70,0.16)'; g.lineWidth = 1;
    for (let v = 0; v < 2; v++) { g.beginPath(); let x = i * a + rnd() * a, y = j * a; g.moveTo(x, y); for (let k = 0; k < 5; k++) { x += (rnd() - 0.5) * 24; y += a / 5; g.lineTo(x, y); } g.stroke(); }
  }
  g.restore();
  speckle(g, w, h, 4000, rnd, 0.06);
  g.save(); g.rotate(Math.PI / 4); g.strokeStyle = 'rgba(70,58,44,0.55)'; g.lineWidth = 2;
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(i * a, -8 * a); g.lineTo(i * a, 8 * a); g.stroke(); g.beginPath(); g.moveTo(-8 * a, i * a); g.lineTo(8 * a, i * a); g.stroke(); }
  g.restore();
}, true);

// stained glass
const LEAD = '#17110c', TRACERY = '#5e5446';
function pointedPath(g, x, y, w, h, sf) { // rectangle with pointed head; (x, y) top-left; sf = head height / h
  const a = w / 2, rise = h * sf, spring = y + rise;
  g.moveTo(x, y + h); g.lineTo(x, spring);
  for (const [px, py] of profPts(a, rise, 16).slice(1)) g.lineTo(x + a + px, spring - py);
  g.lineTo(x + w, y + h); g.closePath();
}
function mosaic(g, x, y, w, h, pal, rnd, cols, rows, jit) {
  const P = [];
  for (let j = 0; j <= rows; j++) { P.push([]); for (let i = 0; i <= cols; i++) { const edge = i === 0 || i === cols || j === 0 || j === rows; P[j].push([x + i * w / cols + (edge ? 0 : (rnd() - 0.5) * jit), y + j * h / rows + (edge ? 0 : (rnd() - 0.5) * jit)]); } }
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    g.fillStyle = pal[Math.floor(rnd() * pal.length)];
    g.beginPath(); g.moveTo(...P[j][i]); g.lineTo(...P[j][i + 1]); g.lineTo(...P[j + 1][i + 1]); g.lineTo(...P[j + 1][i]); g.closePath(); g.fill();
    g.strokeStyle = LEAD; g.lineWidth = 1.6; g.stroke();
  }
}
function medallions(g, cx, ys, R, pal) {
  for (const cy of ys) {
    g.fillStyle = pal[0]; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
    for (let k = 0; k < 6; k++) { g.fillStyle = pal[1 + (k % 3)]; g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R - 4, k * TAU / 6, (k + 1) * TAU / 6); g.closePath(); g.fill(); g.strokeStyle = LEAD; g.lineWidth = 1.5; g.stroke(); }
    g.lineWidth = 3; g.strokeStyle = LEAD; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
  }
}
// clerestory window: two lancets + oculus inside a pointed frame
function clereTex(pal, seed, rich) {
  return canvasTex(128, 384, (g, w, h) => {
    const rnd = rng(seed);
    g.save(); g.beginPath(); pointedPath(g, 2, 2, w - 4, h - 4, 0.41); g.clip();
    g.fillStyle = TRACERY; g.fillRect(0, 0, w, h);
    for (const lx of [11, 67]) {
      g.save(); g.beginPath(); pointedPath(g, lx, 146, 50, 234, 0.2); g.clip();
      mosaic(g, lx, 146, 50, 234, pal, rnd, 4, 16, rich ? 7 : 9);
      if (rich) medallions(g, lx + 25, [205, 270, 335], 18, [pal[3], pal[0], pal[5], pal[1]]);
      g.restore();
    }
    g.save(); g.beginPath(); g.arc(64, 90, 34, 0, TAU); g.clip(); g.fillStyle = LEAD; g.fillRect(20, 50, 90, 90);
    for (let k = 0; k < 8; k++) { g.fillStyle = pal[(k * 3 + seed) % pal.length]; g.beginPath(); g.arc(64 + Math.cos(k * TAU / 8) * 18, 90 + Math.sin(k * TAU / 8) * 18, 12, 0, TAU); g.fill(); g.strokeStyle = LEAD; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = pal[3]; g.beginPath(); g.arc(64, 90, 9, 0, TAU); g.fill();
    g.restore();
    g.restore();
    g.strokeStyle = '#3e372d'; g.lineWidth = 4; g.beginPath(); pointedPath(g, 3, 3, w - 6, h - 6, 0.41); g.stroke();
  });
}
// 1960s non-figurative grisaille lancet (chapels, aisles)
function grisTex(seed) {
  return canvasTex(96, 320, (g, w, h) => {
    const rnd = rng(seed), pal = ['#dcd6c2', '#d2d8cb', '#e0d3b4', '#c8d0d2', '#d8d0c0', '#cfd4c0', '#bcc8d4', '#e4c98c', '#a9bfd6', '#d6b0a0'];
    g.save(); g.beginPath(); pointedPath(g, 2, 2, w - 4, h - 4, 0.18); g.clip();

    if (sub.slice(2) !== id) return;
    const x = num(d.x, -26, 26), z = num(d.z, -64, 70), ry = num(d.ry, -10, 10);
    if (x === null || z === null) return;
    if (!others.has(key) && others.size >= (coarse ? 24 : 80)) return;
    const fresh = !others.has(key);
    const rec = upsertPeer({ peer: key, by: null, presence: { color: d.color, nick: d.nick } }, x, z, ry === null ? 0 : ry);
    rec.mq = true; rec.lastSeen = now;
    setLabel(rec, rec.nick || '순례자');
    if (fresh) updateCount();
  } else if (sub.startsWith('bye/')) {
    if (sub.slice(4) !== id) return;
    const r = others.get(key); if (r) r.lastSeen = Math.min(r.lastSeen, now - 4500);   // let the 5 s prune drop it; a live presence refutes a spoofed bye
  } else if (sub === 'chat') {
    const rec = others.get(key); if (!rec) return;   // unknown senders cannot flood the log
    const text = cleanText(d.text, 120); if (!text) return;
    showBubble(rec, text);
    logLine(rec.name || '순례자', text);
  } else if (sub === 'wave') {
    const rec = others.get(key); if (!rec) return;
    rec.waveT = 0;
    bell(hashStr(id));
    logLine(null, `${rec.name || '순례자'} 님이 손을 흔들었습니다.`, true);
  }
}
function pruneMq(now) {
  let changed = false;
  for (const [key, rec] of others) if (rec.mq && now - rec.lastSeen > 5000) { removePeer(key); changed = true; }
  for (const [id, rl] of mqRate) if (now - rl.t > 10000) mqRate.delete(id);
  for (const [id, s] of mqLastT) if (now - s.at > 60000) mqLastT.delete(id);
  if (changed) updateCount();
}
let lastSent = 0, lastP = null;
function sendPresence(now, full) {
  if (!entered) return;
  const m = netMode();
  const p = { x: r2(me.x), z: r2(me.z), ry: r2(wrapA(me.ry)) };
  if (m === 'room') {
    if (!full && now - lastSent < 70) return;
    if (!full && lastP && p.x === lastP.x && p.z === lastP.z && p.ry === lastP.ry) return;
    lastSent = now; lastP = p;
    const patch = full ? { ...p, color: myColor, nick: myNick() || null } : p;
    room.presence(patch).catch(() => {});
  } else if (m === 'mq' && mq.live) {
    const moved = !mq.lastP || p.x !== mq.lastP.x || p.z !== mq.lastP.z || p.ry !== mq.lastP.ry;
    if (!full && !(moved && now - mq.lastSent >= 100) && now - mq.lastSent < 2000) return;
    mq.lastSent = now; mq.lastP = p;
    mqPub('p/' + myId, { id: myId, ...p, color: myColor, nick: myNick() || null, t: Date.now() });
  }
}

$('chatForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = cleanText(chatInput.value, 120);
  if (!text || viewOnly || !netLive()) return;
  chatInput.value = '';
  if (netMode() === 'room') {
    room.emit('chat', { text }).then(() => showBubble(meRec, text)).catch((err) => { if (err && err.code === 'not_permitted') { viewOnly = true; refreshControls(); waveBtn.disabled = true; } });
  } else { mqPub('chat', { id: myId, mid: newMid(), text }); showBubble(meRec, text); logLine('나', text); }
});
let waveCool = 0;
waveBtn.addEventListener('click', () => {
  initAudio();
  const now = performance.now(); if (now < waveCool) return; waveCool = now + 1500;
  if (meRec) meRec.waveT = 0;
  const m = netMode();
  if (m === 'room' && netLive() && !viewOnly) {
    room.emit('wave').catch((err) => { if (err && err.code === 'not_permitted') { viewOnly = true; waveBtn.disabled = true; refreshControls(); } });
  } else if (m === 'mq' && netLive()) { mqPub('wave', { id: myId, mid: newMid() }); bell(hashStr(myId)); logLine(null, '손을 흔들었습니다.', true); }
  else { bell(hashStr('me')); logLine(null, '손을 흔들었습니다.', true); }
});

// ---------- entry ----------
{
  const saved = store.get('cathedral.nick'); if (saved) $('nick').value = cleanText(saved, 20);
  const savedColor = store.get('cathedral.robe'); if (savedColor && ROBE_HEX.has(savedColor)) myColor = savedColor;
  const wrap = $('robes');
  ROBES.forEach((r) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'robe'; b.id = 'robe-' + r.hex.slice(1);
    b.setAttribute('aria-pressed', String(r.hex === myColor));
    const i = document.createElement('i'); i.style.background = r.hex; b.appendChild(i);
    b.appendChild(document.createTextNode(r.name));
    b.addEventListener('click', () => { myColor = r.hex; wrap.querySelectorAll('.robe').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
    wrap.appendChild(b);
  });
  if (coarse) $('entryHelp').textContent = '화면 왼쪽을 엄지로 밀어 걷고, 오른쪽을 끌어 시점을 돌립니다. 두 손가락으로 벌리거나 모아 카메라 거리를 조절합니다.';
}
$('entryForm').addEventListener('submit', (e) => {
  e.preventDefault();
  initAudio();
  store.set('cathedral.nick', myNick()); store.set('cathedral.robe', myColor);
  entered = true;
  ensureMe(); refreshMyLabel();
  $('entry').hidden = true;
  for (const id of ['badge', 'hint', 'log', 'bar']) $(id).hidden = false;
  $('hint').textContent = coarse ? '왼쪽 엄지로 걷기 · 오른쪽 끌어 시점 돌리기 · 두 손가락 거리' : 'WASD 걷기 · Shift 빠르게 · 끌어서 시점 돌리기 · 휠 거리 · Enter 대화';
  setTimeout(() => $('hint').classList.add('fade'), 9000);
  canvas.focus({ preventScroll: true });
  sendPresence(performance.now(), true);
  logLine(null, '서쪽 정문으로 들어왔습니다. 정면 동쪽 끝이 내진이고, 가운데 교차부에 청동 제단이 있습니다.', true);
});

// ---------- loop ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 70 : 60; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let zoneShown = '', lastPrune = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = performance.now();
  let mySpeed = 0;
  if (entered) {
    mySpeed = movePlayer(dt);
    sendPresence(now, false);
    const z = zoneName(me.x, me.z); if (z !== zoneShown) { zoneShown = z; $('zone').textContent = z; }
  } else {
    cam.yaw = Math.sin(t * 0.1) * 0.22; cam.pitch = 0.3 + Math.sin(t * 0.07) * 0.08;
  }
  updateCamera(dt);
  if (meRec) { meRec.av.g.position.set(me.x, 0, me.z); meRec.av.g.rotation.y = me.ry; animAvatar(meRec, mySpeed, dt, t, now); }

  const k = 1 - Math.exp(-dt * 9);
  for (const rec of others.values()) {
    const c = rec.cur, g = rec.tgt, ox = c.x, oz = c.z;
    c.x += (g.x - c.x) * k; c.z += (g.z - c.z) * k; c.ry += wrapA(g.ry - c.ry) * k;
    rec.av.g.position.set(c.x, 0, c.z); rec.av.g.rotation.y = c.ry;
    animAvatar(rec, Math.hypot(c.x - ox, c.z - oz) / Math.max(dt, 1e-3), dt, t, now);
  }
  if (mq && now - lastPrune > 1000) { lastPrune = now; pruneMq(now); }

  flameMat.size = 0.13 * (reduceMotion ? 1 : 0.9 + 0.1 * Math.sin(t * 13.7) * Math.sin(t * 7.3 + 1.2));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
updateCount();
requestAnimationFrame(frame);
connectNet();
</script>
